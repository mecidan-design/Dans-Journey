<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dan's trip to Iceland</title>
<style>
/* =========================================================
   DAN'S TRIP TO ICELAND - flipbook de viaje.
   Estetica: vikingo + manualidad de Art Attack 1999
   (carton, cinta de papel, papel rasgado, pintura) sobre
   la base de dibujito de los 90 de 5th form.
   Sin fuentes externas y SIN SONIDO (los videos van sin pista de audio).
   ========================================================= */
:root{
  --negro:#141414;
  --crema:#FFF8E7; --papel:#FFFDF5;
  --carton:#C89558; --carton-osc:#A8743A;
  --rosa:#FF3D7F; --turquesa:#00C2CB; --amarillo:#FFD23F;
  --naranja:#FF7A1A; --lima:#8FE04A; --violeta:#7B3FF2;
  --rojo:#EF2B2D; --azul:#2D7DD2; --mar:#1B4F8C; --verde:#16C060;
  --gris:#6B6B6B;
  --titulo:"Arial Black","Arial Bold",Impact,"Franklin Gothic Heavy","Trebuchet MS",Arial,sans-serif;
  --cuerpo:"Trebuchet MS",Verdana,"Segoe UI",Arial,sans-serif;
  --mano:"Comic Sans MS","Chalkboard SE","Comic Neue","Trebuchet MS",cursive;
  --linea:4px solid var(--negro);
  --sombra:6px 6px 0 var(--negro);
  --sombra-chica:4px 4px 0 var(--negro);
  --c:var(--rojo); /* color de la parada actual */
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--cuerpo); color:var(--negro); min-height:100vh;
  padding:18px 16px 0; line-height:1.5;
  /* carton corrugado de manualidad */
  background:
    radial-gradient(circle, rgba(0,0,0,.10) 1.4px, transparent 1.5px) 0 0/20px 20px,
    repeating-linear-gradient(90deg, rgba(255,255,255,.07) 0 6px, rgba(0,0,0,.06) 6px 12px),
    var(--carton);
}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto}
h1,h2,h3,.btn,.chip,.tile,.gap,.label,.tag{font-family:var(--titulo)}
h2,h3{margin:0;line-height:1.05}
.sticker{
  color:var(--crema); -webkit-text-stroke:3px var(--negro); paint-order:stroke fill;
  text-shadow:5px 5px 0 var(--negro);
}

/* ---------- cabecera: mancha de pintura roja ---------- */
.hero{position:relative; display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  justify-content:space-between; margin-bottom:16px}
.logo{position:relative; padding:18px 30px 22px; transform:rotate(-2deg)}
.logo svg.splat{position:absolute; inset:-6px -14px; width:calc(100% + 28px); height:calc(100% + 12px); z-index:0}
.logo h1{position:relative; z-index:1; margin:0; font-size:clamp(1.6rem,5.4vw,2.9rem); line-height:1; text-transform:uppercase}
.logo .sub{position:relative; z-index:1; display:inline-block; margin-top:6px; background:var(--amarillo);
  border:3px solid var(--negro); border-radius:8px; padding:2px 10px; font-family:var(--titulo);
  font-size:.8rem; letter-spacing:1.5px; text-transform:uppercase; transform:rotate(2deg)}
/* escudos vikingos = sellos de progreso */
.shields{max-width:470px; display:flex; flex-wrap:wrap; gap:6px; background:var(--crema); border:var(--linea);
  border-radius:16px; padding:8px 10px; box-shadow:var(--sombra-chica); transform:rotate(1deg)}
.shields .lbl{width:100%; font-family:var(--titulo); font-size:.72rem; letter-spacing:1px; text-transform:uppercase}
.shield{width:34px; height:34px; border-radius:50%; border:3px solid var(--negro); padding:0;
  background:#E9DCC0; position:relative; font-family:var(--titulo); font-size:.8rem}
.shield.done{background:conic-gradient(var(--rojo) 0 90deg, var(--crema) 90deg 180deg, var(--rojo) 180deg 270deg, var(--crema) 270deg)}
.shield.done:after{content:""; position:absolute; inset:9px; border-radius:50%; background:var(--amarillo); border:2px solid var(--negro)}
.shield span{position:relative; z-index:1}
.shield.done span{display:none}

/* ---------- el libro ---------- */
.book{perspective:2400px; margin-bottom:14px}
.spread{display:grid; grid-template-columns:1fr 1fr; position:relative;
  border:6px solid var(--negro); border-radius:20px; box-shadow:12px 12px 0 var(--negro);
  background:var(--negro); gap:6px; transform-style:preserve-3d}
/* lomo del libro */
.spread:before{content:""; position:absolute; left:50%; top:0; bottom:0; width:6px; margin-left:-3px;
  background:repeating-linear-gradient(180deg, var(--amarillo) 0 10px, var(--negro) 10px 20px); z-index:3}
.page{position:relative; min-height:560px; padding:26px 26px 30px; overflow:hidden; backface-visibility:hidden}
.page.left{border-radius:14px 0 0 14px; transform-origin:right center;
  /* cartulina de color con puntos de trama */
  background:radial-gradient(circle, rgba(0,0,0,.12) 1.4px, transparent 1.5px) 0 0/18px 18px, var(--c)}
.page.right{border-radius:0 14px 14px 0; transform-origin:left center;
  /* hoja rayada de cuaderno */
  background:linear-gradient(90deg, transparent 38px, rgba(239,43,45,.35) 38px 40px, transparent 40px),
    repeating-linear-gradient(180deg, var(--papel) 0 31px, #CFE3F5 31px 33px)}
.pnum{position:absolute; bottom:8px; font-family:var(--mano); font-size:.85rem; color:var(--gris)}
.left .pnum{left:16px; color:rgba(0,0,0,.6)} .right .pnum{right:16px}

/* animacion de pagina */
.out-next .page.right{animation:foldR .28s ease-in forwards}
.in-next .page.left{animation:unfoldL .32s ease-out}
.out-prev .page.left{animation:foldL .28s ease-in forwards}
.in-prev .page.right{animation:unfoldR .32s ease-out}
@keyframes foldR{to{transform:rotateY(-90deg)}}
@keyframes unfoldL{from{transform:rotateY(90deg)}}
@keyframes foldL{to{transform:rotateY(90deg)}}
@keyframes unfoldR{from{transform:rotateY(-90deg)}}

/* ---------- piezas de manualidad ---------- */
.tape{position:absolute; width:110px; height:30px; background:rgba(244,232,180,.88);
  box-shadow:0 1px 2px rgba(0,0,0,.25); z-index:4;
  clip-path:polygon(0 8%,6% 0,12% 10%,18% 0,82% 0,88% 10%,94% 0,100% 8%,100% 92%,94% 100%,88% 90%,82% 100%,18% 100%,12% 90%,6% 100%,0 92%)}
.torn{background:var(--papel); border:var(--linea); box-shadow:var(--sombra-chica); position:relative}
.label{display:inline-block; background:var(--amarillo); border:var(--linea); border-radius:10px;
  padding:4px 14px; box-shadow:var(--sombra-chica); text-transform:uppercase; letter-spacing:1px; font-size:.85rem}
.stopname{font-size:clamp(1.5rem,3.4vw,2.3rem); text-transform:uppercase; margin:10px 0 14px}
.hand{font-family:var(--mano)}

/* marco de foto principal (polaroid pegada con cinta) */
.polaroid{background:#fff; border:var(--linea); box-shadow:var(--sombra); padding:10px 10px 6px;
  position:relative; transform:rotate(-1.5deg); margin:6px auto 0; max-width:440px}
.polaroid .tape.t1{top:-14px; left:-24px; transform:rotate(-30deg)}
.polaroid .tape.t2{top:-14px; right:-24px; transform:rotate(28deg)}
.polaroid .media{width:100%; height:min(52vh,430px); background:#222; display:flex; align-items:center; justify-content:center; overflow:hidden; border:2px solid var(--negro)}
.polaroid img,.polaroid video{width:100%; height:100%; object-fit:contain; display:block; background:#222}
.polaroid .cap{font-family:var(--mano); font-size:1.08rem; text-align:center; padding:8px 4px 2px; min-height:2.6em}
.place{display:inline-block; font-family:var(--titulo); font-size:.7rem; letter-spacing:1px; text-transform:uppercase;
  background:var(--negro); color:var(--crema); border-radius:6px; padding:2px 8px; margin-right:6px; vertical-align:2px}
.thumbs{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-top:18px}
.thumb{width:68px; height:68px; padding:0; border:3px solid var(--negro); border-radius:8px; overflow:hidden;
  background:#222; position:relative; box-shadow:3px 3px 0 var(--negro); transform:rotate(var(--r,0deg))}
.thumb img{width:100%; height:100%; object-fit:cover; display:block}
.thumb.on{outline:4px solid var(--amarillo); outline-offset:2px}
.thumb .play{position:absolute; inset:0; display:flex; align-items:center; justify-content:center}
.thumb .play:after{content:""; border-left:18px solid #fff; border-top:11px solid transparent; border-bottom:11px solid transparent;
  filter:drop-shadow(2px 2px 0 var(--negro)); margin-left:4px}
.vidtag{position:absolute; top:8px; left:8px; z-index:2; background:var(--rojo); color:#fff; border:3px solid var(--negro);
  border-radius:8px; font-family:var(--titulo); font-size:.72rem; padding:1px 8px; letter-spacing:1px}

/* ---------- pagina derecha: tareas ---------- */
.story{background:var(--crema); border:var(--linea); border-radius:18px; padding:14px 16px 14px 18px;
  box-shadow:var(--sombra-chica); position:relative; font-size:1.06rem; margin:2px 0 18px}
.story b.who{font-family:var(--titulo); text-transform:uppercase; font-size:.8rem; letter-spacing:1px; display:block; color:var(--c)}
.story:after{content:""; position:absolute; left:-20px; top:22px; border:12px solid transparent; border-right:16px solid var(--negro)}
.task{margin:0 0 18px}
.task h3{font-size:1rem; text-transform:uppercase; display:flex; align-items:center; gap:8px; margin-bottom:8px}
.task h3 .n{display:inline-flex; width:30px; height:30px; border-radius:50%; background:var(--c); color:#fff;
  border:3px solid var(--negro); align-items:center; justify-content:center; font-size:.9rem; flex:none}
.task h3 .ok{margin-left:auto; font-size:.75rem; background:var(--lima); border:3px solid var(--negro); border-radius:8px; padding:1px 8px; transform:rotate(3deg)}
.wordbox{border:4px solid var(--rojo); background:#fff; border-radius:6px; padding:8px 10px; display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:10px}
.chip{background:var(--amarillo); border:3px solid var(--negro); border-radius:10px; padding:5px 12px; font-size:.95rem;
  box-shadow:3px 3px 0 var(--negro); transition:transform .1s}
.chip:hover{transform:translate(-1px,-1px) rotate(-2deg)}
.chip.used{opacity:.35; box-shadow:none; transform:none; cursor:default}
.chip.pick{background:var(--turquesa); color:#fff}
.sent{font-size:1.06rem; margin:8px 0; line-height:2.2}
.sent .let{font-family:var(--titulo); margin-right:6px}
.gap{min-width:96px; display:inline-block; border:none; border-bottom:4px dashed var(--negro); background:transparent;
  padding:0 8px; font-size:1rem; line-height:1.4; vertical-align:baseline}
.gap.sel{background:rgba(255,210,63,.55); border-radius:6px 6px 0 0}
.gap.full{border-bottom-style:solid; color:var(--mar)}
.gap.good{background:var(--lima); border-radius:6px; border-bottom-color:transparent; color:var(--negro)}
.gap.bad{background:#FFB3B3; border-radius:6px; animation:shake .35s}
.tray,.answer{display:flex; flex-wrap:wrap; gap:8px; min-height:52px; padding:8px; border-radius:12px}
.tray{background:rgba(0,194,203,.12); border:3px dashed var(--turquesa)}
.answer{background:#fff; border:3px solid var(--negro); margin-top:8px}
.answer.good{background:#E4FBD2}
.answer.bad{animation:shake .35s; background:#FFE1E1}
.answer:empty:before{content:"Tap the words in order…"; font-family:var(--mano); color:var(--gris); padding:6px}
.tile{background:#fff; border:3px solid var(--negro); border-radius:8px; padding:4px 10px; box-shadow:3px 3px 0 var(--negro); font-size:.95rem}
.answer .tile{background:var(--amarillo)}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:10px}
.btn{background:var(--c); color:#fff; border:var(--linea); border-radius:12px; padding:7px 16px; box-shadow:var(--sombra-chica);
  text-transform:uppercase; letter-spacing:1px; font-size:.85rem}
.btn:hover{transform:translate(-1px,-1px)}
.btn:active{transform:translate(3px,3px); box-shadow:1px 1px 0 var(--negro)}
.btn.ghost{background:#fff; color:var(--negro)}
.fb{font-family:var(--mano); font-size:1rem; min-height:1.4em}
.fb.yes{color:#0B7A2E} .fb.no{color:#B3121B}
textarea{width:100%; min-height:80px; font-family:var(--mano); font-size:1.1rem; border:var(--linea); border-radius:12px;
  padding:10px; background:#fff; resize:vertical}
.starters{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px}
.starter{background:#fff; border:2px solid var(--negro); border-radius:999px; padding:3px 10px; font-family:var(--mano); font-size:.92rem}
.starter.w{background:#FFF1B8}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* ---------- portada ---------- */
.cover-left{display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
  background:repeating-linear-gradient(180deg, #1B4F8C 0 26px, #1A5FA3 26px 52px) !important}
.cover-left h2{font-size:clamp(2rem,5vw,3.4rem); text-transform:uppercase}
.cover-left .by{margin-top:10px}
.ship{width:100%; max-width:420px; margin-top:8px}
.bigbtn{font-size:1.1rem; padding:12px 24px; margin-top:14px; background:var(--rojo)}
.goal{background:#3BA6D9; color:#fff; border:var(--linea); border-radius:14px; overflow:hidden; box-shadow:var(--sombra-chica); margin:16px 0}
.goal .t{background:#1C7FB0; padding:6px 14px; font-family:var(--titulo); text-transform:uppercase; font-size:.9rem; letter-spacing:1px}
.goal ul{margin:0; padding:8px 14px 10px 34px}
.howto{list-style:none; padding:0; margin:0}
.howto li{display:flex; gap:10px; align-items:flex-start; margin:8px 0}
.howto .dot{flex:none; width:30px; height:30px; border-radius:50%; border:3px solid var(--negro); display:flex; align-items:center; justify-content:center; font-family:var(--titulo); font-size:.85rem; color:#fff}

/* ---------- mapa ---------- */
.map{width:100%; max-width:520px; display:block; margin:0 auto}
.map .pin{cursor:pointer}
.map .pin:hover circle{fill:var(--amarillo)}
.stoplist{list-style:none; margin:0; padding:0; columns:2; column-gap:14px}
.stoplist li{break-inside:avoid; margin:0 0 8px}
.stoplist button{width:100%; text-align:left; display:flex; gap:8px; align-items:center; background:#fff; border:3px solid var(--negro);
  border-radius:10px; padding:5px 8px; box-shadow:3px 3px 0 var(--negro); font-family:var(--titulo); font-size:.82rem; text-transform:uppercase}
.stoplist .num{flex:none; width:26px; height:26px; border-radius:50%; border:2px solid var(--negro); color:#fff; display:flex; align-items:center; justify-content:center; font-size:.75rem}
.stoplist .tick{margin-left:auto; color:#0B7A2E}

/* ---------- match y adivinanzas ---------- */
.grid{display:grid; grid-template-columns:repeat(2,1fr); gap:14px}
.ph{position:relative; border:var(--linea); background:#fff; padding:6px; box-shadow:var(--sombra-chica); transform:rotate(var(--r,0deg))}
.ph img{width:100%; aspect-ratio:4/3; object-fit:cover; display:block; border:2px solid var(--negro)}
.ph .let{position:absolute; top:-12px; left:-12px; width:34px; height:34px; border-radius:50%; background:var(--rojo); color:#fff;
  border:3px solid var(--negro); font-family:var(--titulo); display:flex; align-items:center; justify-content:center}
.ph .stick{position:absolute; left:50%; bottom:12px; transform:translateX(-50%) rotate(-3deg); background:var(--lima); border:3px solid var(--negro);
  border-radius:8px; padding:1px 10px; font-family:var(--titulo); font-size:.85rem; white-space:nowrap}
button.ph{cursor:pointer; width:100%}
.ph.bad{animation:shake .35s; outline:5px solid var(--rojo)}
.ph.good{outline:5px solid var(--lima)}
.ph.target{outline:5px dashed var(--amarillo); outline-offset:3px}
.riddle{background:#fff; border:var(--linea); border-radius:14px; padding:12px; box-shadow:var(--sombra-chica); margin-bottom:12px}
.riddle p{margin:0 0 8px; font-size:1.05rem}
.ropts{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
.ropts .ph{padding:4px}
.ropts .ph .let{width:26px; height:26px; font-size:.75rem; top:-9px; left:-9px}

/* ---------- diario ---------- */
.jentry{display:flex; gap:12px; align-items:flex-start; background:#fff; border:3px solid var(--negro); border-radius:12px;
  padding:8px; box-shadow:3px 3px 0 var(--negro); margin-bottom:10px}
.jentry img{width:64px; height:64px; object-fit:cover; border:2px solid var(--negro); border-radius:6px; flex:none}
.jentry .s{font-family:var(--mano); font-size:1.08rem}
.jentry .k{font-family:var(--titulo); font-size:.7rem; text-transform:uppercase; letter-spacing:1px; color:var(--gris)}
.score{display:flex; gap:10px; flex-wrap:wrap; margin:10px 0 14px}
.score div{background:var(--amarillo); border:var(--linea); border-radius:12px; padding:6px 12px; font-family:var(--titulo); box-shadow:var(--sombra-chica)}

/* ---------- navegacion ---------- */
.nav{display:flex; align-items:center; justify-content:space-between; gap:10px; margin:8px 0 18px}
.nav .btn{font-size:1rem; padding:10px 18px}
.nav .btn[disabled]{opacity:.4; cursor:default}
.nav .where{font-family:var(--titulo); background:var(--crema); border:var(--linea); border-radius:12px; padding:6px 14px; box-shadow:var(--sombra-chica); text-align:center}

/* ---------- comparativos (language detective) ---------- */
.cmp{margin-bottom:10px}
.cmp .adj{font-family:var(--mano); color:var(--gris)}
.opts{display:flex; flex-wrap:wrap; gap:8px; margin:2px 0 4px 22px}
.opt{background:#fff; border:3px solid var(--negro); border-radius:10px; padding:4px 12px; box-shadow:3px 3px 0 var(--negro); font-family:var(--titulo); font-size:.9rem}
.opt:hover{background:var(--amarillo)}
.opt.bad{background:#FFB3B3; animation:shake .35s; text-decoration:line-through}
.hint{margin:4px 0 0 22px; background:#E6F3FB; border:2px solid #1C7FB0; border-radius:8px; padding:3px 10px; font-size:.92rem; display:inline-block}
.detective{background:#fff; border:var(--linea); border-radius:16px; overflow:hidden; box-shadow:var(--sombra); transform:rotate(-1deg); position:relative; z-index:1}
.detective .dh{background:#0E4C8A; color:#fff; font-family:var(--titulo); padding:8px 14px; font-size:1rem}
.detective .db{padding:10px 16px 12px; color:#0E4C8A}
.detective .db p{margin:0 0 4px}
.detective ul{margin:8px 0 0; padding-left:20px; color:var(--negro)}
.detective li{margin-bottom:8px; font-weight:bold}
.detective li span{font-weight:normal; color:#0E4C8A}
.detective u{color:var(--rojo); text-decoration-thickness:3px}
.lupa{width:90px; display:block; margin:-14px 0 0 auto; transform:rotate(8deg); position:relative; z-index:2}
.baskets{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin:10px 0}
.basket{background:#fff; border:var(--linea); border-radius:14px 14px 22px 22px; box-shadow:var(--sombra-chica); padding:8px; text-align:center; min-height:96px;
  background-image:repeating-linear-gradient(45deg, rgba(200,149,88,.18) 0 8px, transparent 8px 16px)}
.basket b{display:block; font-family:var(--titulo); font-size:1rem}
.basket small{display:block; font-family:var(--mano); color:var(--gris)}
.basket .in{display:flex; flex-wrap:wrap; gap:4px; justify-content:center; margin-top:6px}
.basket.bad{animation:shake .35s; border-color:var(--rojo)}
.tword{display:inline-block; background:var(--amarillo); border:2px solid var(--negro); border-radius:7px; padding:1px 7px; font-family:var(--titulo); font-size:.78rem; margin:2px}
.tword.ex{background:#fff; color:var(--azul)}
.tword.bad{background:#FFB3B3; animation:shake .35s}
.tablewrap{overflow-x:auto}
.adjtable{width:100%; border-collapse:collapse; background:#fff; border:3px solid var(--negro); table-layout:fixed; min-width:430px}
.adjtable th{background:#4FB3BF; color:var(--negro); font-family:var(--titulo); font-size:.78rem; padding:6px 4px; border:2px solid var(--negro)}
.adjtable td{border:2px solid var(--negro); vertical-align:top; padding:0}
.tcell{min-height:130px; padding:4px; cursor:pointer; text-align:center}
.tcell:hover{background:#FFF6CC}
.tcell.locked{cursor:default; background:#E4FBD2}
.tcell .plus{display:block; font-family:var(--titulo); color:var(--gris); font-size:1.2rem}
.tf{background:#fff; border:var(--linea); border-radius:14px; padding:10px 12px; box-shadow:var(--sombra-chica); margin-bottom:12px}
.tf p{margin:0; font-size:1.05rem}
.tf.done{background:#F4FFEC}
.tbtn{border:3px solid var(--negro); border-radius:10px; padding:4px 16px; font-family:var(--titulo); box-shadow:3px 3px 0 var(--negro); color:#fff; text-transform:uppercase; font-size:.85rem}
.tbtn.t{background:var(--verde)} .tbtn.f{background:var(--azul)}
.tbtn.bad{animation:shake .35s; background:#999; text-decoration:line-through}
.tfa{margin-top:6px; font-family:var(--mano)}
.tfa .tag{font-family:var(--titulo); color:#fff; border:2px solid var(--negro); border-radius:6px; padding:0 6px; font-size:.8rem}
.tfa .tag.t{background:var(--verde)} .tfa .tag.f{background:var(--rojo)}

footer{text-align:center; padding:14px 10px 22px; font-family:var(--titulo); font-size:.85rem; letter-spacing:.5px}
footer span{background:var(--crema); border:3px solid var(--negro); border-radius:10px; padding:4px 12px; display:inline-block}

/* ---------- celular: una pagina debajo de la otra ---------- */
@media (max-width:860px){
  .spread{grid-template-columns:1fr}
  .spread:before{display:none}
  .page{min-height:0; padding:22px 16px 30px}

  var s = live.stop, x = S(s.id);
  var st1 = '';
  s.starters.forEach(function(w){ st1 += '<button class="starter" data-ins="'+esc(w)+'">'+esc(w)+' ...</button>'; });
  var st2 = '';
  s.words.forEach(function(w){ st2 += '<button class="starter w" data-ins="'+esc(w)+'">'+esc(w)+'</button>'; });
  document.getElementById('tD').innerHTML =
    '<h3><span class="n">D</span>Your turn! Compare two things'+okTag(!!x.w)+'</h3>'+
    '<p style="margin:0 0 6px">Look at the photos and videos. Write <b>your own</b> sentence with a comparative. <span class="hand">The ... is ...er than ...</span></p>'+
    '<div class="starters">'+st1+'</div><div class="starters">'+st2+'</div>'+
    '<textarea id="wr" placeholder="The waterfall is higher than ..." maxlength="240">'+esc(live.draft!=null?live.draft:x.w)+'</textarea>'+
    '<div class="row"><button class="btn" data-stick="1">&#9986; Stick it in my journal</button><span class="fb" id="fbD"></span></div>';
}

/* ---------- 2.3 Activity 3: adivinanzas ---------- */
var riddleOpts = null;
function renderRiddles(){
  if (!riddleOpts) riddleOpts = RIDDLES.map(function(r,i){
    var others = shuffle(RIDDLES.filter(function(o,j){ return j!==i; })).slice(0,2).map(function(o){ return o.img; });
    return shuffle([r.img].concat(others));
  });
  var half = Math.ceil(RIDDLES.length/2);
  function block(from,to){
    var h = '';
    for (var i=from;i<to;i++){
      var r = RIDDLES[i], ans = st.riddles[i];
      var o = '';
      riddleOpts[i].forEach(function(img,j){
        var cls = 'ph' + (ans && img===r.img ? ' good' : '');
        o += '<button class="'+cls+'" data-riddle="'+i+'" data-img="'+img+'" style="--r:'+rot(i+j)+'"><span class="let">'+'abc'[j]+'</span><img src="'+M+img+'" alt="Photo '+'abc'[j]+'" loading="lazy"></button>';
      });
      h += '<div class="riddle"><p><b>'+(i+1)+'.</b> '+esc(r.q)+(ans?' <b style="color:#0B7A2E">✔</b>':'')+'</p><div class="ropts">'+o+'</div></div>';
    }
    return h;
  }
  var n = Object.keys(st.riddles).length;
  pL.innerHTML = '<span class="label">Quiz time</span><h2 class="stopname sticker">Guess the photo</h2>'+
    '<p style="margin-top:0;color:#fff;font-weight:bold;text-shadow:2px 2px 0 #141414">Read what Dan says. Which photo is he describing?</p>'+block(0,half);
  pR.innerHTML = block(half,RIDDLES.length)+'<div class="fb'+(n===RIDDLES.length?' yes':'')+'">'+(n===RIDDLES.length?'Wow! You guessed them all. You are a real Viking explorer!':n+' / '+RIDDLES.length+' guessed')+'</div>';
}

/* ---------- 2.1 Activity 6: true / false ---------- */
function renderTF(){
  function block(from,to){
    var h = '';
    for (var i=from;i<to;i++){
      var q = TF[i], ans = st.tf[i];
      h += '<div class="tf'+(ans?' done':'')+'"><p><b>'+(i+1)+'.</b> '+esc(q.s)+'</p>'+
        (ans ? '<div class="tfa"><span class="tag '+(q.a?'t':'f')+'">'+(q.a?'TRUE':'FALSE')+'</span> '+esc(q.why)+'</div>' :
          '<div class="row" style="margin-top:4px"><button class="tbtn t'+(live.tfbad===i+'t'?' bad':'')+'" data-tf="'+i+'" data-v="1">True</button><button class="tbtn f'+(live.tfbad===i+'f'?' bad':'')+'" data-tf="'+i+'" data-v="0">False</button></div>')+
        '</div>';
    }
    return h;
  }
  var n = Object.keys(st.tf).length;
  pL.innerHTML = '<span class="label">Iceland quiz</span><h2 class="stopname sticker">True or false?</h2>'+
    '<p style="margin-top:0;color:#fff;font-weight:bold;text-shadow:2px 2px 0 #141414">Read Dan’s quiz. Is it true or false?</p>'+block(0,4);
  pR.innerHTML = block(4,TF.length)+
    '<div class="fb'+(n===TF.length?' yes':'')+'">'+(n===TF.length?'Quiz complete! You know Iceland very well.':n+' / '+TF.length+' answered')+'</div>'+
    '<div class="task" style="margin-top:14px"><h3><span class="n">★</span>Write a true / false sentence'+okTag(!!st.tfw)+'</h3>'+
    '<p style="margin:0 0 6px">Write a sentence about Iceland or Argentina with a comparative. Ask a friend: true or false?</p>'+
    '<div class="starters"><button class="starter" data-ins="Argentina is">Argentina is ...</button><button class="starter" data-ins="Iceland is">Iceland is ...</button><button class="starter w" data-ins="hotter than">hotter than</button><button class="starter w" data-ins="bigger than">bigger than</button><button class="starter w" data-ins="more beautiful than">more beautiful than</button></div>'+
    '<textarea id="wr" placeholder="Argentina is hotter than Iceland." maxlength="240">'+esc(live.draft!=null?live.draft:st.tfw)+'</textarea>'+
    '<div class="row"><button class="btn" data-sticktf="1">&#9986; Stick it in my journal</button><span class="fb" id="fbD"></span></div></div>';
}

/* ---------- diario ---------- */
function renderJournal(){
  var shields = STOPS.filter(stopDone).length;
  var ent = '', any = false;
  STOPS.forEach(function(s,i){
    var w = S(s.id).w;
    if (!w) return; any = true;
    var m = s.media[0];
    ent += '<div class="jentry"><img src="'+M+(m.img||m.poster)+'" alt=""><div><div class="k">Stop '+(i+1)+' · '+esc(s.name)+'</div><div class="s">'+esc(w)+'</div></div></div>';
  });
  if (st.tfw){ any = true; ent += '<div class="jentry"><img src="'+M+'p7466.jpg" alt=""><div><div class="k">My true / false sentence</div><div class="s">'+esc(st.tfw)+'</div></div></div>'; }
  pL.innerHTML =
    '<span class="label">The end... or is it?</span>'+
    '<h2 class="stopname sticker">My Iceland journal</h2>'+
    '<div class="polaroid" style="transform:rotate(2deg)"><div class="tape t1"></div><div class="tape t2"></div>'+
    '<div class="media"><img src="'+M+'p1721.jpg" alt="The northern lights"></div>'+
    '<div class="cap">We did it! We found the northern lights!</div></div>';
  pR.innerHTML =
    '<div class="score"><div>Shields: '+shields+'/'+STOPS.length+'</div><div>Detective: '+Object.keys(st.sort).length+'/'+SORT.length+'</div><div>Photos: '+Object.keys(st.riddles).length+'/'+RIDDLES.length+'</div><div>True/false: '+Object.keys(st.tf).length+'/'+TF.length+'</div></div>'+
    '<h3 style="text-transform:uppercase;margin-bottom:10px">My sentences about Iceland</h3>'+
    (any ? ent : '<p class="hand">Your journal is empty. Go to a stop and write your own sentence in task D!</p>')+
    '<div class="row no-print"><button class="btn" data-print="1">Print my journal</button><button class="btn ghost" data-reset="all">Start the trip again</button></div>';
}

/* ---------- navegacion con vuelta de pagina ---------- */
var busy = false;
function go(n){
  n = Math.max(0, Math.min(PAGES.length-1, n));
  if (n===cur || busy) return;
  var dir = n>cur ? 'next' : 'prev';
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  stopVideos();
  if (reduce){ cur = n; render(); toBook(); return; }
  busy = true;
  book.classList.add('out-'+dir);
  setTimeout(function(){
    book.classList.remove('out-'+dir);
    cur = n; render();
    book.classList.add('in-'+dir);
    setTimeout(function(){ book.classList.remove('in-'+dir); busy = false; }, 340);
    toBook();
  }, 270);
}
function toBook(){ var r = book.getBoundingClientRect(); if (r.top < 0) window.scrollTo({top: window.scrollY + r.top - 10, behavior:'smooth'}); }
function stopVideos(){ document.querySelectorAll('video').forEach(function(v){ try{ v.pause(); }catch(e){} }); }
function setFb(id, kind){ var f = document.getElementById(id); if (f) f.className = 'fb ' + kind; }
function cleanSentence(txt){
  txt = txt.replace(/\s+/g,' ').trim();
  if (!/[.!?]$/.test(txt)) txt += '.';
  return txt.charAt(0).toUpperCase() + txt.slice(1);
}
function wordCount(txt){ txt = txt.trim(); return txt ? txt.split(/\s+/).length : 0; }

/* ---------- clicks ---------- */
var pickedWord = null;
document.addEventListener('click', function(e){
  var b = e.target.closest('button, .pin, .tcell'); if (!b) return;
  var d = b.dataset || {}, gattr = b.getAttribute('data-go');
  if (gattr!=null){ go(+gattr); return; }
  if (b.id==='prev'){ go(cur-1); return; }
  if (b.id==='next'){ go(cur+1); return; }

  /* fotos de la parada */
  if (d.media!=null){
    var m = live.stop.media[+d.media];
    stopVideos();
    document.getElementById('media').innerHTML = mediaHTML(m);
    document.getElementById('cap').innerHTML = '<span class="place">'+esc(m.place)+'</span>'+esc(m.cap);
    document.querySelectorAll('.thumb').forEach(function(t){ t.classList.toggle('on', t===b); });
    return;
  }
  /* tarea A */
  if (d.gap!=null){
    var i = +d.gap;
    if (live.fill[i]) live.fill[i] = '';
    live.sel = i; live.fbA = ''; drawA(); return;
  }
  if (d.chip!=null){
    var empty = live.fill[live.sel] ? live.fill.indexOf('') : live.sel;
    if (empty<0) return;
    live.fill[empty] = d.chip;
    var nx = live.fill.indexOf(''); live.sel = nx<0 ? empty : nx;
    live.fbA = ''; drawA(); return;
  }
  if (d.check==='A'){
    if (live.fill.indexOf('')>=0){ live.fbA = 'Fill all the spaces first!'; drawA(); setFb('fbA','no'); return; }
    var marks = live.fill.map(function(w,i){ return w===live.answers[i]; });
    if (marks.every(Boolean)){ S(live.stop.id).a = true; save(); drawA(); renderShields(); return; }
    live.marks = marks; live.fbA = 'Not yet! Look at the red space and try again.';
    drawA(); setFb('fbA','no');
    live.fill = live.fill.map(function(w,i){ return marks[i] ? w : ''; });
    live.sel = live.fill.indexOf('');
    setTimeout(function(){ if (document.getElementById('tA')) { drawA(); setFb('fbA','no'); } }, 900);
    return;
  }
  /* tarea B: comparativos */
  if (d.cmp!=null){
    var ci = +d.cmp, q = live.stop.cmp[ci];
    if (d.o===q.a){ S(live.stop.id).c[ci] = true; save(); delete live.cbad[ci]; drawB(); renderShields(); return; }
    live.cbad[ci] = d.o; drawB(); return;
  }
  /* tarea C */
  if (d.tile!=null){
    var t = live.tiles.filter(function(q){ return q.k===+d.tile; })[0];
    live.built.push(t); live.fbC=''; drawC(); return;
  }
  if (d.untile!=null){ live.built.splice(+d.untile,1); live.fbC=''; drawC(); return; }
  if (d.clear==='C'){ live.built = []; live.fbC=''; drawC(); return; }
  if (d.check==='C'){
    var s2 = live.stop;
    if (live.built.length < live.tiles.length){ live.fbC = 'Use all the words!'; drawC(); setFb('fbC','no'); return; }
    if (live.built.map(function(q){return q.w;}).join(' ')===s2.build){ S(s2.id).b = true; save(); drawC(); renderShields(); return; }
    live.fbC = 'Almost! Check the order of the words.'; live.badB = true; drawC(); setFb('fbC','no'); return;
  }
  /* tarea D y oracion true/false */
  if (d.ins!=null){
    var ta = document.getElementById('wr'), v = ta.value, add = d.ins;
    if (v && !/\s$/.test(v)) add = ' '+add;
    ta.value = (v + add + ' ').slice(0,240); ta.focus(); live.draft = ta.value; return;
  }
  if (d.stick || d.sticktf){
    var txt = document.getElementById('wr').value, fb = document.getElementById('fbD');
    if (wordCount(txt) < 4){ fb.textContent = 'Write a longer sentence: at least 4 words!'; fb.className='fb no'; return; }
    if (!/\bthan\b/i.test(txt)){ fb.textContent = 'Use a comparative with than! Try: ...er than / more ... than.'; fb.className='fb no'; return; }
    if (d.stick){ S(live.stop.id).w = cleanSentence(txt); live.draft = null; save(); drawD(); renderShields(); }
    else { st.tfw = cleanSentence(txt); live.draft = null; save(); renderTF(); }
    var f2 = document.getElementById('fbD'); f2.textContent = 'Stuck in your journal! ✔'; f2.className='fb yes';
    return;
  }
  /* 2.3 Activity 1 */
  if (d.mword!=null){
    if (st.match[d.mword]) return;
    pickedWord = d.mword;
    document.querySelectorAll('[data-mword]').forEach(function(c){ c.classList.toggle('pick', c===b); });
    document.querySelectorAll('[data-mimg]').forEach(function(p){ if (!st.match[p.dataset.mimg]) p.classList.add('target'); });
    return;
  }
  if (d.mimg!=null){
    if (st.match[d.mimg]) return;
    var fbm = document.getElementById('mfb');
    if (!pickedWord){ fbm.textContent = 'First tap a word in the box!'; fbm.className='fb no'; return; }
    if (pickedWord===d.mimg){ st.match[pickedWord] = true; save(); pickedWord = null; renderMatch(); return; }
    b.classList.remove('bad'); void b.offsetWidth; b.classList.add('bad');
    fbm.textContent = 'Oops! That photo is not "'+pickedWord+'". Try another one.'; fbm.className='fb no';
    return;
  }
  /* 2.1 Activity 2: tabla */
  if (d.adj!=null){ live.adj = d.adj; live.tfb = null; renderTable(); return; }
  if (d.tdel!=null){
    e.stopPropagation();
    var pr = d.tdel.split('|'), col = tableState()[pr[0]];
    col.splice(col.indexOf(pr[1]),1); live.tbad = null; live.tfb = null; save(); renderTable(); return;
  }
  if (d.tcol!=null){
    if (st.tableOk) return;
    if (!live.adj){ live.tfb = {t:'First tap an adjective in the box!', ok:false}; renderTable(); return; }
    var c2 = tableState()[d.tcol];
    if (c2.indexOf(live.adj)<0) c2.push(live.adj);
    live.tbad = null; live.tfb = null; save(); renderTable(); return;
  }
  if (d.tcheck){
    var tb = tableState(), bad = {}, nbad = 0, few = 0;
    TABLE.forEach(function(c){
      if (tb[c.k].length < 3) few++;
      tb[c.k].forEach(function(a){ if (c.ok.indexOf(a)<0){ bad[c.k+'|'+a] = 1; nbad++; } });
    });
    if (nbad){ live.tbad = bad; live.tfb = {t:'Hmm! Look at the red words. Do they describe that landscape?', ok:false}; }
    else if (few){ live.tfb = {t:'Good! Now put at least three adjectives in every column.', ok:false}; }
    else { st.tableOk = true; save(); }
    renderTable(); return;
  }
  if (d.treset){ st.table = null; live.tbad = null; live.tfb = null; save(); renderTable(); return; }
  /* language detective */
  if (d.sw!=null){ live.sw = d.sw; live.sfb = ''; live.badB = null; renderDetective(); return; }
  if (d.bk!=null){
    if (!live.sw){ live.sfb = 'First tap a word!'; renderDetective(); return; }
    var item = SORT.filter(function(x){ return x.w===live.sw; })[0];
    if (item.r===d.bk){ st.sort[item.w] = true; save(); live.sw = null; live.sfb = ''; live.badB = null; }
    else { live.badB = d.bk; live.sfb = 'Not that basket! Look at the end of "'+item.w+'".'; }
    renderDetective(); return;
  }
  /* 2.3 Activity 3 */
  if (d.riddle!=null){
    var ri = +d.riddle;
    if (st.riddles[ri]) return;
    if (d.img===RIDDLES[ri].img){ st.riddles[ri] = true; save(); renderRiddles(); return; }
    b.classList.remove('bad'); void b.offsetWidth; b.classList.add('bad'); return;
  }
  /* true / false */
  if (d.tf!=null){
    var ti = +d.tf, val = d.v==='1';
    if (val===TF[ti].a){ st.tf[ti] = true; save(); live.tfbad = null; }
    else live.tfbad = ti+(val?'t':'f');
    renderTF(); return;
  }
  if (d.print){ window.print(); return; }
  if (d.reset==='match'){ st.match = {}; save(); matchOrder = null; pickedWord = null; renderMatch(); return; }
  if (d.reset==='sort'){ st.sort = {}; save(); sortOrder = null; live.sw = null; renderDetective(); return; }
  if (d.reset==='all'){
    if (!confirm('Start the trip again? Your shields and sentences will be deleted.')) return;
    st = {stops:{}, match:{}, riddles:{}, table:null, tableOk:false, sort:{}, tf:{}, tfw:'', page:0};
    save(); matchOrder = null; riddleOpts = null; sortOrder = null; go(0); return;
  }
});
document.addEventListener('input', function(e){ if (e.target.id==='wr') live.draft = e.target.value; });
document.addEventListener('keydown', function(e){
  if (/TEXTAREA|INPUT/.test(e.target.tagName)) return;
  if (e.key==='ArrowRight') go(cur+1);
  if (e.key==='ArrowLeft') go(cur-1);
});

render();
</script>
